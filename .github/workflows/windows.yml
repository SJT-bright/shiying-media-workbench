name: Windows build and runtime verification
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        id: cache
        with:
          path: build/media-windows/Tools
          key: media-windows-${{ hashFiles('Vendor/MediaSources/sources.json', 'Scripts/build_media_tools.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 nasm meson ninja-build pkg-config
          bash Scripts/build_media_tools.sh windows build/media-windows
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: media-build-diagnostics
          path: build/media-windows/sources/ffmpeg/ffbuild/config.log
      - uses: actions/upload-artifact@v7
        with:
          name: windows-media-tools
          path: build/media-windows/Tools
  windows:
    needs: media
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Desktop/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: windows-media-tools
          path: build/windows-tools
      - name: Dependencies and isolated regression checks
        shell: pwsh
        run: |
          python -m pip install -r requirements-build.txt
          npm ci --prefix Desktop
          New-Item -ItemType Directory -Force build/creator-rootqa | Out-Null
          $env:PYTHONPATH="$pwd/Backend;$pwd/Backend/upstream/src"
          $env:POCKET_TOOLS="$pwd/build/windows-tools"
          $env:PYTHONUTF8="1"
          $env:PYTHONIOENCODING="utf-8"
          python -m unittest discover -s Tests -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw 'Backend regression failed' }
          npm test --prefix Desktop
          if ($LASTEXITCODE -ne 0) { throw 'Desktop regression failed' }
          python Scripts/audit_release.py . --source
          if ($LASTEXITCODE -ne 0) { throw 'Source audit failed' }
      - name: Build standalone worker and installer
        shell: pwsh
        run: |
          python Scripts/build_windows.py --tools build/windows-tools
          if ($LASTEXITCODE -ne 0) { throw 'Worker build failed' }
          npm run build:win --prefix Desktop
          if ($LASTEXITCODE -ne 0) { throw 'Desktop package failed' }
      - name: Run the actual packaged Windows EXE
        shell: pwsh
        run: |
          $report="$pwd/dist/windows/windows-runtime.json"
          $process=Start-Process -FilePath "$pwd/dist/windows/win-unpacked/拾影.exe" -ArgumentList '--self-test',"--self-test-report=$report" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "EXE failed: $($process.ExitCode)" }
          $result=Get-Content $report -Raw | ConvertFrom-Json
          if (!$result.passed -or $result.platform -ne 'win32' -or !$result.packaged) { throw 'Native packaged result missing' }
          python Scripts/audit_release.py dist/windows
          if ($LASTEXITCODE -ne 0) { throw 'Package audit failed' }
          Get-ChildItem dist/windows -File | Where-Object { $_.Extension -in '.exe','.zip' } | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content dist/windows/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: |
            dist/windows/*Setup.exe
            dist/windows/*.zip
            dist/windows/SHA256SUMS.txt
            dist/windows/windows-runtime.json
            dist/windows/windows-runtime.png
